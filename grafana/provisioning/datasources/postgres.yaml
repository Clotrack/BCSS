apiVersion: 1

datasources:
  - name: PostgreSQL-BCSS  # El nombre que se visualizará en Grafana
    type: postgres
    url: db:5432           # El nombre del servicio DDBB en docker-compose
    database: BCSS
    user: user
   # IMPORTANTE: Borrada la línea 'password: password' evitado fallo de conexion
    secureJsonData:
      password: "password"
    jsonData:
      sslmode: 'disable'
      postgresVersion: 15
      timescaledb: false
    editable: true  # <--- ESTO permitirá editar en la UI si algo falla en la conexión